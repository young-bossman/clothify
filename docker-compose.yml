services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app2
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  webserver:
    image: nginx:alpine
    container_name: laravel_webserver2
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  # Vite dev server. The app container has no Node, so asset builds live here.
  node:
    image: node:22-alpine
    container_name: laravel_vite2
    working_dir: /var/www
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      # Masks the host node_modules: it holds Windows-native esbuild and rollup
      # binaries that abort on exec under Alpine. This named volume keeps a
      # separate Linux install for the container.
      - node_modules:/var/www/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_phpmyadmin2
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
  node_modules: